<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>CARDITOPOLI — il portfolio giocabile di Mauro Esposito</title>
<meta name="description" content="Carditopoli: un piccolo RPG 2D in stile Game Boy Advance ispirato a Cardito (NA). Esplora la città e scopri i progetti di Mauro Esposito.">
<meta name="theme-color" content="#13241A">
<meta property="og:title" content="CARDITOPOLI — Versione Carciofo">
<meta property="og:description" content="Il portfolio di Mauro Esposito, in forma di videogioco.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect x='4' y='5' width='8' height='9' fill='%237EA070'/%3E%3Crect x='3' y='8' width='10' height='3' fill='%235E8A58'/%3E%3Crect x='7' y='2' width='2' height='3' fill='%239A6AA8'/%3E%3Crect x='7' y='14' width='2' height='2' fill='%234E7A4E'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="shell">
    <div id="padL" class="pad">
      <div class="dpad">
        <button data-btn="up" class="d up" aria-label="Su"></button>
        <button data-btn="left" class="d left" aria-label="Sinistra"></button>
        <span class="d mid"></span>
        <button data-btn="right" class="d right" aria-label="Destra"></button>
        <button data-btn="down" class="d down" aria-label="Giù"></button>
      </div>
    </div>
    <div id="screenWrap">
      <div id="screen">
        <canvas id="cv" width="240" height="160"></canvas>
        <div id="ui"></div>
      </div>
      <div id="brand">CARDITOPOLI <span>· VERSIONE CARCIOFO</span></div>
    </div>
    <div id="padR" class="pad">
      <div class="ab">
        <button data-btn="b" class="btn b" aria-label="B">B</button>
        <button data-btn="a" class="btn a" aria-label="A">A</button>
      </div>
      <div class="ss">
        <button data-btn="select" class="pill" aria-label="Select">SELECT</button>
        <button data-btn="start" class="pill" aria-label="Start">START</button>
      </div>
    </div>
  </div>
  <div id="hint"><b>Frecce</b> muovi · <b>Z</b>/<b>A</b> parla, conferma · <b>X</b>/<b>S</b> corri (tieni premuto), indietro · <b>Invio</b> menu · <b>M</b> musica</div>
  <noscript>Carditopoli è un videogioco: attiva JavaScript per giocare.</noscript>
</div>
<script src="js/gfx.js"></script>
<script src="js/data.js"></script>
<script src="js/maps.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
</body>
</html>
